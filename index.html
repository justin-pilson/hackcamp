<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangtime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jomhuria&display=swap">
<style>
/* Layout: one 402px-wide app column, pinned action at the bottom, content scrolls between. Values from Figma "Polished Flows / Account Setup". */
:root {
  color-scheme: light;
  --light-blue: #bee9e8; --turquoise: #1b4965; --orange: #ee6c4d; --sky: #62b6cb; --blue: #5fa8d3;
  --baby-blue: #cae9ff; --mist: #effafa; --ink: #0f172a; --slate: #64748b; --line: #e2e8f0; --white: #fff;
  --display: "Jomhuria", Georgia, serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --soft: 0 2px 6px rgba(15,23,41,.08);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --out: cubic-bezier(.22,1,.36,1);
  --vh: 100dvh;
  --top: clamp(16px, calc(var(--vh) - 822px), 52px);
}
html, body { margin: 0; }
html, body, #root { height: 100%; }
body { background: var(--light-blue); color: var(--turquoise); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--turquoise); outline-offset: 2px; }
h1, p { margin: 0; }
svg { display: block; }

.app { position: relative; height: 100%; max-width: 402px; margin: 0 auto; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.screen.in-fwd { animation: inFwd .42s var(--out) both; }
.screen.in-back { animation: inBack .42s var(--out) both; }
.screen.out-fwd { animation: outFwd .26s ease-in both; pointer-events: none; }
.screen.out-back { animation: outBack .26s ease-in both; pointer-events: none; }
.screen[class*="out-"] * { animation: none !important; }
@keyframes inFwd { from { opacity: 0; transform: translateX(44px) rotate(1.2deg); } }
@keyframes inBack { from { opacity: 0; transform: translateX(-44px) rotate(-1.2deg); } }
@keyframes outFwd { to { opacity: 0; transform: translateX(-36px) rotate(-1deg); } }
@keyframes outBack { to { opacity: 0; transform: translateX(36px) rotate(1deg); } }

.scroll { position: relative; z-index: 1; flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.foot { position: relative; z-index: 1; flex: none; padding: 8px 24px clamp(20px, calc(var(--vh) - 832px), 42px); display: flex; flex-direction: column; align-items: center; }

/* Items settle in one after another when a step opens */
.rise { animation: rise .5s var(--out) both; animation-delay: calc(var(--i, 0) * 55ms + 90ms); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* Buttons */
.cta { width: 100%; height: 52px; border-radius: 999px; background: var(--orange); color: var(--white); font-weight: 600; font-size: 15px; box-shadow: 0 6px 16px rgba(238,108,77,.3); transition: transform .18s var(--spring), background .2s, box-shadow .2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
.cta:active { transform: scale(.96); }
.cta[aria-disabled="true"] { background: #f4a897; box-shadow: none; cursor: default; }
.cta.big { height: 56px; font-size: 17px; max-width: 338px; }
.textbtn { color: var(--turquoise); font-weight: 600; font-size: 15px; height: 36px; padding: 0 18px; border-radius: 999px; transition: transform .18s var(--spring); }
.textbtn:active { transform: scale(.94); }
.textbtn.small { margin-top: 14px; font-weight: 500; font-size: 14px; height: 20px; padding: 0; }
.bump { display: inline-block; animation: bump .3s var(--spring); }
@keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.3); } }

/* Start */
.start { background: var(--light-blue); }
.art-wrap { position: relative; flex: 1; min-height: 0; }
.art { position: absolute; left: 50%; top: 50%; width: 402px; height: 650px; translate: -50% -50%; scale: var(--s, 1); }
.art-in { position: absolute; left: 0; top: -66px; width: 402px; height: 874px; }
.at { position: absolute; left: var(--x); top: var(--y); translate: -50% -50%; rotate: var(--r, 0deg); }
.word { font-family: var(--display); font-size: 220px; line-height: .72; color: var(--turquoise); white-space: nowrap; -webkit-text-stroke: 20px var(--white); paint-order: stroke fill; stroke-linejoin: miter; filter: drop-shadow(4px 6px 0 var(--turquoise)); animation: stamp .62s var(--spring) both; animation-delay: var(--d); }
@keyframes stamp { from { opacity: 0; scale: 1.28; rotate: calc(var(--r) - 7deg); } 55% { opacity: 1; } }
.sticker { display: block; padding: 9px 16px; border: 3px solid var(--white); border-radius: 999px; font-weight: 600; font-size: 14px; line-height: 20px; white-space: nowrap; box-shadow: 2px 3px 0 var(--turquoise); animation: pop .5s var(--spring) both; animation-delay: var(--d); }
@keyframes pop { from { opacity: 0; scale: .3; rotate: calc(var(--r) - 14deg); } }
.mascot-in { animation: waddleIn .7s var(--spring) both .55s; }
@keyframes waddleIn { from { opacity: 0; transform: translateY(46px) rotate(-10deg); } }
.mascot-idle { transform-origin: 50% 96%; animation: waddle 3.4s ease-in-out infinite 1.3s; }
@keyframes waddle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-2.4deg); } 75% { transform: rotate(2.4deg); } }
.hand-m { transform-origin: 84.31px 109.8px; animation: tick 12s steps(12) infinite; }
.hand-h { transform-origin: 84.31px 109.8px; animation: tick 144s steps(12) infinite; }
@keyframes tick { to { transform: rotate(360deg); } }
.board { animation: pop .55s var(--spring) both .5s; }
.board-idle { animation: bob 4.2s ease-in-out infinite 1.2s; }
@keyframes bob { 50% { transform: translateY(-6px) rotate(1.5deg); } }
.twinkle { animation: pop .45s var(--spring) both var(--d), twinkle 3.2s ease-in-out infinite calc(var(--d) + 1s); }
@keyframes twinkle { 50% { transform: scale(.76) rotate(14deg); } }

/* Step header */
.top { display: flex; align-items: center; justify-content: space-between; height: 44px; margin: var(--top) 16px 0; }
.back { width: 40px; height: 40px; border-radius: 20px; background: var(--white); box-shadow: var(--soft); display: flex; align-items: center; justify-content: center; transition: transform .18s var(--spring); }
.back:hover svg { transform: translateX(-2px); }
.back svg { transition: transform .18s var(--out); }
.back:active { transform: scale(.88); }
.bars { display: flex; gap: 6px; }
.bar { position: relative; width: 48px; height: 4px; border-radius: 2px; background: var(--white); overflow: hidden; }
.bar i { position: absolute; inset: 0; border-radius: 2px; background: var(--orange); transform-origin: left; }
.bar.now i { animation: fill .55s var(--out) both .18s; }
@keyframes fill { from { transform: scaleX(0); } }
.skip { font-weight: 600; font-size: 14px; color: var(--turquoise); padding: 12px 0 12px 8px; transition: transform .18s var(--spring); }
.skip:active { transform: scale(.92); }
.q { padding: 20px 24px 0; display: flex; flex-direction: column; gap: 6px; }
.q h1 { font-family: var(--display); font-weight: 400; font-size: 64px; line-height: .8; outline: none; text-wrap: balance; }
.q h1.sm { font-size: 54px; }
.q p { font-size: 14px; opacity: .75; }

/* About you */
.photo { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 30px; }
.photo-btn { position: relative; width: 112px; height: 112px; border-radius: 56px; background: var(--white); filter: drop-shadow(0 4px 6px rgba(15,23,41,.08)) drop-shadow(0 1px 1.5px rgba(15,23,41,.06)); transition: transform .2s var(--spring); display: block; cursor: pointer; }
.photo-btn:hover { transform: scale(1.04) rotate(-2deg); }
.photo-btn:active { transform: scale(.94); }
.photo-btn:focus-within { outline: 2.5px solid var(--turquoise); outline-offset: 2px; }
.photo-btn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.ring { position: absolute; inset: 0; animation: spin 26s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.plus { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; pointer-events: none; }
.photo-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid var(--white); pointer-events: none; animation: pop .45s var(--spring) both; }
.photo-label { font-weight: 600; font-size: 13px; }
.fields { display: flex; flex-direction: column; gap: 18px; padding: 24px 24px 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; }
.field label { font-weight: 600; font-size: 13px; }
.count { font-size: 12px; color: var(--slate); font-variant-numeric: tabular-nums; }
.count.full { color: var(--orange); font-weight: 600; }
.box { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 14px; border-radius: 16px; background: var(--white); box-shadow: var(--soft); border: 1.5px solid transparent; transition: border-color .15s; }
.box:focus-within { border-color: var(--sky); }
.box.bad { border-color: var(--orange); }
.box.area { height: 96px; padding: 12px 14px; align-items: flex-start; }
.box input, .box textarea { flex: 1; width: 100%; min-width: 0; border: 0; outline: 0; background: none; font-weight: 500; font-size: 15px; color: var(--ink); resize: none; padding: 0; line-height: 18px; height: 100%; }
.at-sign { font-weight: 500; font-size: 15px; color: var(--slate); }
.ok { flex: none; width: 20px; height: 20px; border-radius: 10px; background: var(--sky); color: var(--white); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; animation: pop .4s var(--spring) both; }
.wait { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--sky); animation: spin .7s linear infinite; }
.hint { font-size: 12px; line-height: 15px; min-height: 15px; color: rgba(27,73,101,.75); }
.hint.bad { color: #b8432a; font-weight: 500; }
.shake { animation: shake .4s ease; }
@keyframes shake { 20% { transform: translateX(-6px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } 90% { transform: translateX(2px); } }

/* Interests */
.sections { display: flex; flex-direction: column; gap: 12px; padding: 22px 24px 16px; }
.sec-head { display: flex; align-items: center; gap: 8px; }
.sec-head b { font-weight: 700; font-size: 15px; }
.sec-head span { font-size: 12px; color: var(--slate); transition: color .2s; }
.sec-head span.done { color: var(--turquoise); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 9px 14px; border-radius: 999px; background: var(--white); color: var(--turquoise); box-shadow: var(--soft); font-weight: 600; font-size: 13px; line-height: 16px; white-space: nowrap; transition: background .16s, color .16s, box-shadow .16s, transform .2s var(--spring); }
.chip-w { display: inline-flex; animation: rise .42s var(--out) both; animation-delay: calc(var(--i) * 24ms + 140ms); }
.chip:hover { transform: translateY(-2px); }
.chip:active { transform: scale(.92); }
.chip.on { background: var(--turquoise); color: var(--white); box-shadow: none; }
.chip.just { animation: chipPop .36s var(--spring); }
@keyframes chipPop { 0% { transform: scale(.86); } 55% { transform: scale(1.09) rotate(-1.5deg); } }
.tick { display: inline-block; margin-right: 4px; }
.chip.just .tick { animation: pop .34s var(--spring) both; }
.chip.add { background: none; box-shadow: none; outline: 1.5px dashed var(--turquoise); outline-offset: -1.5px; }
.chip.add:focus-visible { outline-style: solid; }
.chip-input { padding: 9px 14px; width: 150px; border-radius: 999px; background: var(--white); border: 1.5px solid var(--sky); outline: 0; font-weight: 600; font-size: 13px; line-height: 13px; height: 34px; animation: pop .25s var(--spring) both; }
.gap8 { height: 8px; }

/* Socials */
.socials { margin: 6px 16px 12px; padding: 4px 16px; background: var(--white); border: 2px solid var(--sky); border-radius: 32px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.logo { flex: none; width: 40px; height: 40px; border-radius: 12px; background: #000; display: flex; align-items: center; justify-content: center; transition: transform .25s var(--spring); }
.row.linked .logo { animation: logoHop .5s var(--spring); }
@keyframes logoHop { 40% { transform: translateY(-5px) rotate(-7deg); } }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.who b { font-weight: 600; font-size: 15px; color: var(--ink); }
.who span { font-size: 12px; color: var(--slate); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link { position: relative; flex: none; min-width: 56px; height: 30px; padding: 0 14px; border-radius: 999px; background: var(--white); border: 1.5px solid var(--turquoise); color: var(--ink); font-weight: 600; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: transform .18s var(--spring); }
.link::after { content: ""; position: absolute; inset: -8px -4px; }
.link:active { transform: scale(.92); }
.link.on { background: var(--sky); border-color: var(--sky); color: var(--white); padding: 0 10px; animation: pop .38s var(--spring) both; }
.link .wait { width: 14px; height: 14px; }
.later { font-size: 12px; color: var(--slate); margin-bottom: 14px; }

/* Done */
.head { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: var(--top); margin-top: 10px; }
.head h1 { font-family: var(--display); font-weight: 400; font-size: 64px; line-height: .8; outline: none; animation: stampSoft .6s var(--spring) both .08s; }
@keyframes stampSoft { from { opacity: 0; transform: scale(1.22) rotate(-3deg); } }
.head p { font-size: 14px; opacity: .75; }
.conf { position: absolute; left: calc(50% + var(--dx)); top: calc(var(--top) + var(--dy)); animation: burst .75s var(--spring) both var(--d), twinkle 3.6s ease-in-out infinite calc(var(--d) + 1.1s); }
@keyframes burst { from { opacity: 0; translate: calc(var(--dx) * -.9) 26px; scale: .2; rotate: -120deg; } }
.cards { display: flex; flex-direction: column; gap: 10px; padding: 17px 16px 12px; }
.hero { padding: 20px; background: var(--sky); color: var(--white); border-radius: 36px 10px 36px 36px; display: flex; flex-direction: column; gap: 14px; animation: card .62s var(--spring) both .22s; }
.about { padding: 18px; background: var(--mist); border: 2px solid var(--sky); border-radius: 26px 26px 26px 8px; display: flex; flex-direction: column; gap: 12px; animation: card .62s var(--spring) both .36s; }
@keyframes card { from { opacity: 0; transform: translateY(30px) rotate(-1.6deg); } }
.who-row { display: flex; align-items: center; gap: 16px; }
.avatar { flex: none; width: 76px; height: 76px; border-radius: 50%; animation: hello 1s ease-in-out .85s; transform-origin: 50% 90%; }
.avatar img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 3.45px solid var(--white); }
@keyframes hello { 20% { transform: rotate(-9deg); } 45% { transform: rotate(7deg); } 70% { transform: rotate(-4deg); } }
.id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.name { font-family: var(--display); font-size: 60px; line-height: .56; padding-top: 4px; overflow-wrap: anywhere; }
.handle { font-size: 14px; line-height: 20px; color: rgba(255,255,255,.85); overflow-wrap: anywhere; }
.status { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--white); color: var(--turquoise); font-weight: 500; font-size: 12px; line-height: 16px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s ease-out infinite 1.2s; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); } 80%, 100% { box-shadow: 0 0 0 7px rgba(74,222,128,0); } }
.bio { font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
.stats { display: flex; gap: 8px; }
.stat { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.2); }
.stat b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: .72; }
.stat span { font-size: 12px; line-height: 16px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group h2 { margin: 0; font-weight: 500; font-size: 12px; line-height: 16px; letter-spacing: .8px; text-transform: uppercase; color: var(--slate); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { padding: 6px 12px; border-radius: 999px; background: var(--baby-blue); color: var(--turquoise); font-weight: 500; font-size: 12px; line-height: 16px; animation: pop .4s var(--spring) both; animation-delay: calc(var(--i) * 45ms + 620ms); --r: 0deg; }
.tag.try { background: var(--light-blue); }
.tag.soc { display: flex; align-items: center; gap: 6px; background: var(--white); border: 1.5px solid var(--turquoise); }
.tag.soc svg { width: 14px; height: 14px; }
.tag.soc svg.wide { width: 26px; height: 7px; }
.tag.soc svg path { fill: var(--turquoise); }
.divider { height: 1px; background: var(--line); }
.foot.done { gap: 6px; padding-bottom: clamp(12px, calc(var(--vh) - 843px), 31px); }

/* Background stars and wave. They sit behind the content and drop out when the screen gets short. */
.decor { position: absolute; left: 0; bottom: 0; z-index: 0; pointer-events: none; }
.decor path { transform-box: fill-box; transform-origin: center; animation: pop .5s var(--spring) both .45s, twinkle 3.8s ease-in-out infinite 1.4s; --r: 0deg; }
.decor path:nth-of-type(odd) { animation-delay: .55s, 2.1s; }
.decor path.wave { animation: draw 1s var(--out) both .4s; stroke-dasharray: 1; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@media (max-height: 790px) and (orientation: portrait) { .decor.fold { display: none; } }

/* Map View. The world layer uses Figma's map coordinates, so pins and map pan together. */
.map-screen { background: #bfe4d1; overflow: hidden; --shift: calc((var(--vh) - 874px) * .6); }
.world { position: absolute; left: 50%; top: var(--shift); margin-left: -201px; width: 744px; height: 992px; transform: translate(-142px, 0); transition: transform .7s cubic-bezier(.3,1.2,.4,1); animation: worldIn .8s var(--out) both; transform-origin: 340px 340px; }
.world.party { transform: translate(-109px, -42px); }
.world > .map-art { position: absolute; inset: 0; }
@keyframes worldIn { from { scale: 1.07; } }
.fade { position: absolute; inset: -400px; background: rgba(255,255,255,.35); opacity: 0; transition: opacity .35s; pointer-events: none; }
.fade.on { opacity: 1; }
.item { position: absolute; left: var(--x); top: var(--y); transition: left .7s cubic-bezier(.3,1.2,.4,1), opacity .3s; }
.item.dim { opacity: .35; }
.item.gone { opacity: 0; pointer-events: none; }
.drop { animation: dropIn .6s var(--spring) both; animation-delay: var(--d); }
@keyframes dropIn { from { opacity: 0; transform: translateY(-34px) scale(.6); } }
.person { width: 36px; height: 36px; border-radius: 18px; border: 3px solid var(--white); box-shadow: 0 3px 8px rgba(15,23,41,.22); color: var(--white); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: transform .2s var(--spring); }
.person:active, .pin:active { transform: scale(.9); }
.pin { display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .2s var(--spring); }
.pin-in { position: relative; display: flex; flex-direction: column; align-items: center; }
.pin-head { position: relative; border-radius: 50%; border: 3px solid var(--white); box-shadow: 0 4px 10px rgba(15,23,41,.18); margin-bottom: -2px; display: flex; align-items: center; justify-content: center; }
.pin-head svg circle { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite 1.4s; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.pin.live .pin-in::before { content: ""; position: absolute; left: 50%; top: 36px; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; background: var(--orange); animation: sonar 2.6s ease-out infinite 1.1s; }
@keyframes sonar { 0% { transform: scale(1); opacity: .4; } 75%, 100% { transform: scale(1.65); opacity: 0; } }
.count-b { position: absolute; top: -4px; padding: 2px 7px; border: 2px solid var(--white); border-radius: 999px; background: var(--turquoise); color: var(--white); font-weight: 700; }
.pin-label { padding: 3px 8px; border-radius: 10px; background: var(--white); color: var(--turquoise); box-shadow: 0 2px 6px rgba(15,23,41,.1); font-weight: 600; font-size: 11px; white-space: nowrap; }
.pres { position: absolute; inset: 0; pointer-events: none; }
.pres > * { pointer-events: auto; }
.pres.leaving { animation: leave .2s ease-in both; }
@keyframes leave { to { opacity: 0; transform: translateY(14px); } }
.selected { position: absolute; left: 145px; top: 314px; width: 330px; display: flex; flex-direction: column; align-items: center; transform-origin: 50% 100%; animation: pinGrow .55s var(--spring) both .16s; }
@keyframes pinGrow { from { opacity: 0; transform: scale(.35); } }
.capsule { display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; margin-bottom: -2px; border: 3px solid var(--white); border-radius: 30px; background: var(--turquoise); box-shadow: 0 4px 8px rgba(15,23,41,.06), 0 12px 24px rgba(15,23,41,.12); }
.stack { display: flex; }
.stack > * { margin-right: -11px; animation: stackIn .4s var(--spring) both; animation-delay: calc(var(--i) * 55ms + 320ms); }
.stack > *:last-child { margin-right: 0; }
@keyframes stackIn { from { opacity: 0; transform: translateX(-18px) scale(.6); } }
.av38 { width: 38px; height: 38px; border-radius: 19px; border: 2px solid var(--turquoise); font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; }

.cw-host em { font-style: normal; padding: 2px 8px; border-radius: 999px; background: var(--light-blue); color: #334155; font-weight: 600; font-size: 11px; }
.cw-wait { font-weight: 500; font-size: 13px; color: var(--slate); }
.cw-invited { display: flex; flex-wrap: wrap; gap: 16px; }
.cw-p { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--slate); animation: pop .42s var(--spring) both; animation-delay: calc(var(--i) * 60ms + 280ms); --r: 0deg; }
.cw-a40 { width: 40px; height: 40px; border-radius: 20px; opacity: .6; color: var(--white); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.cw-a48 { width: 48px; height: 48px; border-radius: 24px; background-size: cover; background-position: center; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.cw-going-list { display: flex; justify-content: space-between; width: 100%; }
.cw-also { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 12px; color: var(--slate); }
.cw-st20 { display: flex; }
.cw-st20 span { width: 20px; height: 20px; border-radius: 10px; border: 2px solid var(--white); color: var(--white); font-weight: 600; font-size: 8px; display: flex; align-items: center; justify-content: center; }
.cw-st20 span:first-child { margin-right: -6px; }
.cw-actions { flex: none; display: flex; gap: 12px; padding: 12px 24px 24px; background: var(--white); }
.cw-actions .btn { flex: 1; height: 52px; min-width: 0; }
.cw-outline { background: var(--white); border: 1.5px solid var(--turquoise); color: var(--turquoise); }
.cw-rsvp { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 24px 18px; background: var(--white); border-radius: 28px 28px 0 0; box-shadow: 0 -4px 24px rgba(27,73,101,.12); }
.cw-rsvp div { flex: 1; min-width: 0; display: flex; flex-direction: column; white-space: nowrap; }

.cw-rsvp span { font-size: 12px; color: var(--slate); }
.cw-rsvp-btn { flex: none; height: 52px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 15px; white-space: nowrap; background: var(--orange); color: var(--white); box-shadow: 0 6px 16px rgba(238,108,77,.35); transition: transform .18s var(--spring), background .2s, color .2s, box-shadow .2s; }
.cw-rsvp-btn:active { transform: scale(.94); }
.cw-rsvp-btn.cw-on { background: var(--baby-blue); color: var(--turquoise); box-shadow: none; animation: chipPop .4s var(--spring); }

/* Wave ended */
.we-dim { position: absolute; z-index: 10; inset: 0; background: rgba(27,73,101,.5); animation: fadeIn .3s both; }
.we-dim.we-out { animation: weFade .24s both; }
@keyframes weFade { to { opacity: 0; } }
.we-pop { position: absolute; z-index: 11; left: 0; right: 0; bottom: 0; max-height: calc(100% - 12px); overflow-x: hidden; overflow-y: auto; scrollbar-width: none; padding: 22px 16px 20px; background: var(--light-blue); border-radius: 28px 28px 0 0; box-shadow: 0 -8px 30px rgba(15,23,41,.22); animation: wePop .68s cubic-bezier(.3,1.42,.5,1) both .12s; }
.we-pop::-webkit-scrollbar { display: none; }
.we-pop.we-out { animation: weDown .26s ease-in both; }
@keyframes wePop { from { transform: translateY(105%); } }
@keyframes weDown { to { transform: translateY(105%); } }
.we-grab { position: absolute; left: 50%; margin-left: -18px; top: 9px; width: 36px; height: 4px; border-radius: 2px; background: rgba(27,73,101,.25); }
.we-top { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 8px; height: 32px; margin-bottom: 8px; }
.we-top b { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: .72; color: var(--turquoise); }
.we-skip { font-weight: 600; font-size: 14px; line-height: 20px; color: var(--turquoise); transition: transform .18s var(--spring); }
.we-skip:active { transform: scale(.92); }
.we-rate { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 20px 18px; background: var(--mist); border: 2px solid var(--sky); border-radius: 26px 26px 26px 8px; animation: rise .5s var(--out) both .42s; }
.we-rate h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 48px; line-height: .72; color: var(--turquoise); text-align: center; outline: none; }
.we-rate p { margin: 0; font-size: 12px; line-height: 16px; color: var(--slate); }
.we-stars { display: flex; gap: 6.8px; height: 30px; }

.we-star:active { transform: scale(.85); }
.we-star svg { width: 30px; height: 30px; display: block; }
.we-star svg path { fill: #e2e8f0; transition: fill .16s; }
.we-star.we-on svg path { fill: var(--orange); }
.we-star.we-on svg { animation: chipPop .4s var(--spring); }
.we-field { display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 16px; border-radius: 999px; background: var(--white); text-align: left; transition: transform .18s var(--spring); }
.we-field:active { transform: scale(.98); }
.we-field.we-blue { background: var(--baby-blue); }
.we-field > span:nth-child(2) { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; color: var(--slate); }
.we-field em { font-style: normal; font-weight: 600; font-size: 20px; line-height: 28px; color: var(--turquoise); transition: transform .18s var(--out); }
.we-field:hover em { transform: translateX(3px); }
.we-field.we-blue { animation: weNudge 2.6s ease-in-out infinite 1.6s; }
@keyframes weNudge { 0%, 78%, 100% { transform: translateX(0); } 86% { transform: translateX(3px); } 93% { transform: translateX(-2px); } }
.we-mascot { position: relative; z-index: 0; height: 65px; display: flex; justify-content: center; }
.we-mascot > div { width: 72px; height: 72px; margin-top: 9px; transform-origin: 50% 100%; animation: wePeek .65s var(--spring) both .8s, ppHello 1s ease-in-out 1.5s; }
.we-mascot svg { width: 72px; height: 72px; display: block; }

.we-next h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 60px; line-height: .72; }
.we-next p { margin: 0; font-size: 14px; line-height: 20px; text-align: center; }
.we-inv { display: flex; align-items: center; justify-content: space-between; width: 100%; font-weight: 500; font-size: 14px; line-height: 20px; }
.we-inv span { font-weight: 400; font-size: 12px; line-height: 16px; color: rgba(255,255,255,.8); }
.we-contacts { display: flex; justify-content: space-between; width: 100%; }
.we-c { width: 44px; height: 44px; border-radius: 22px; border: 3px solid transparent; opacity: .75; font-weight: 500; font-size: 14px; line-height: 20px; display: flex; align-items: center; justify-content: center; transition: opacity .15s, border-color .15s, transform .2s var(--spring); }
.we-c:active { transform: scale(.88); }
.we-c.we-on { opacity: 1; border-color: var(--white); animation: chipPop .36s var(--spring); }
.we-start { width: 100%; height: 50px; flex: none; border-radius: 999px; background: var(--orange); color: var(--white); box-shadow: 0 6px 16px rgba(238,108,77,.3); font-weight: 600; font-size: 16px; line-height: 20px; transition: transform .18s var(--spring); }
.we-start:active { transform: scale(.97); }
.we-page { position: absolute; z-index: 3; inset: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; padding-bottom: 114px; background: var(--light-blue); animation: inFwd .4s var(--out) both; }
.we-page::-webkit-scrollbar { display: none; }

.we-page .we-skip { position: absolute; right: 24px; top: calc(var(--top) + 14px); }

.we-ready-t b { font-family: var(--display); font-weight: 400; font-size: 52px; line-height: .8; }
.we-ready-t span { font-weight: 500; font-size: 13px; }

@media (orientation: landscape) and (min-width: 700px) {

  .app { position: absolute; left: 50%; top: 50%; width: 402px; height: 874px; margin: -437px 0 0 -201px; background: var(--light-blue); border-radius: 48px; transform: scale(var(--fit, 1)); box-shadow: 0 0 0 10px #0d2c40, 0 24px 60px rgba(8,28,42,.45); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

/* Replays a one-shot CSS animation by toggling its class */
function useNudge() {
  const [on, setOn] = useState(false);
  const fire = () => { setOn(false); requestAnimationFrame(() => setOn(true)); };
  useEffect(() => { if (!on) return; const t = setTimeout(() => setOn(false), 420); return () => clearTimeout(t); }, [on]);
  return [on ? 'shake' : '', fire];
}

function Top({ step, onBack, onSkip }) {
  return html`<div className="top">
    <button id="back-${step}" className="back" aria-label="Back" onClick=${onBack}><${Art} svg=${SVG.back} /></button>
    <div className="bars" role="img" aria-label=${`Step ${step} of 3`}>
      ${[1, 2, 3].map(n => html`<span key=${n} className=${'bar' + (n === step ? ' now' : '')}>${n <= step && html`<i></i>`}</span>`)}
    </div>
    ${onSkip ? html`<button id="skip" className="skip" onClick=${onSkip}>Skip</button>` : html`<span></span>`}
  </div>`;
}

function Title({ children, small }) {
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus({ preventScroll: true }); }, []);
  return html`<h1 ref=${ref} tabIndex="-1" className=${small ? 'sm' : ''}>${children}</h1>`;
}

/* Start */
function Start({ next }) {
  const wrap = useRef(null), art = useRef(null);
  useLayoutEffect(() => {
    const fit = () => {
      const width = wrap.current.offsetWidth, height = wrap.current.offsetHeight;
      art.current.style.setProperty('--s', Math.min(width / 402, height / 650, 1.1));
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(wrap.current);
    return () => ro.disconnect();
  }, []);
  const sticker = (label, x, y, r, d, bg, fg) => html`<div className="at" style=${{ '--x': x + 'px', '--y': y + 'px' }}><span className="sticker" style=${{ '--r': r + 'deg', '--d': d + 'ms', background: bg, color: fg, rotate: r + 'deg' }}>${label}</span></div>`;
  const star = (svg, x, y, d) => html`<${Art} svg=${svg} tag="div" className="at twinkle" style=${{ '--x': x + 'px', '--y': y + 'px', '--d': d + 'ms', '--r': '0deg' }} />`;
  return html`<div className="art-wrap" ref=${wrap}>
      <div className="art" ref=${art}><div className="art-in">
        <h1 style=${{ margin: 0, fontWeight: 400 }}>
          <span className="at word" style=${{ '--x': '175.16px', '--y': '261.2px', '--r': '4deg', '--d': '60ms' }}>hang</span>
          <span className="at word" style=${{ '--x': '224.97px', '--y': '405.5px', '--r': '-3deg', '--d': '240ms' }}>time</span>

        ${star(SVG.starA, 335, 163.5, 620)}${star(SVG.starB, 58, 349, 720)}${star(SVG.starC, 160, 627, 820)}
        <div className="at" style=${{ '--x': '101.2px', '--y': '514.2px', '--r': '0deg' }}><${Art} svg=${SVG.surf} tag="div" className="board" style=${{ '--r': '0deg' }} /></div>
        <div className="at" style=${{ '--x': '302.96px', '--y': '548.8px' }}><div className="mascot-in"><${Art} svg=${SVG.mascot} tag="div" className="mascot-idle" /></div></div>
        ${sticker('study waves', 90.95, 124, 8, 420, 'var(--orange)', '#fff')}
        ${sticker('boba runs', 297.7, 102, -6, 500, 'var(--blue)', '#fff')}
        ${sticker('sunset hangs', 91.4, 584, -5, 760, '#fff', 'var(--turquoise)')}
        ${sticker('pickup games', 179.6, 672.4, 4, 840, 'var(--turquoise)', '#fff')}

}

/* A1 · About you */
function About({ data, set, next, back }) {
  const [userState, setUserState] = useState(data.username ? 'ok' : 'idle');
  const [showErrors, setShowErrors] = useState(false);
  const [nameShake, nudgeName] = useNudge();
  const [userShake, nudgeUser] = useNudge();
  const firstCheck = useRef(true);

  useEffect(() => {
    if (firstCheck.current) { firstCheck.current = false; return; }
    const u = data.username;
    if (!u) { setUserState('idle'); return; }
    if (u.length < 3) { setUserState('short'); return; }
    setUserState('wait');
    const t = setTimeout(() => setUserState(TAKEN.includes(u) ? 'taken' : 'ok'), 550);
    return () => clearTimeout(t);
  }, [data.username]);

  const nameOk = data.name.trim().length > 0;
  const valid = nameOk && userState === 'ok';
  const hints = {
    idle: 'Letters, numbers, dots and underscores.',
    short: 'Use at least 3 characters.',
    wait: 'Checking…',
    ok: 'Available! Friends can find you with this.',
    taken: `@${data.username} is taken. Try another one.`,
  };
  const userBad = userState === 'taken' || (showErrors && userState !== 'ok' && userState !== 'wait');
  const pickPhoto = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => set({ photo: r.result });
    r.readAsDataURL(f);
  };
  const go = () => {
    if (valid) return next();
    setShowErrors(true);
    if (!nameOk) nudgeName();
    if (userState !== 'ok') nudgeUser();
  };
  return html`<${Art} svg=${SVG.decorA1} tag="div" style=${{ display: 'contents' }} />
    <${Top} step=${1} onBack=${back} />
    <div className="scroll">
      <div className="q rise" style=${{ '--i': 0 }}><${Title} small=${true}>Let's set up your profile<//><p>This is what your friends will see.</p></div>
      <div className="photo rise" style=${{ '--i': 1 }}>
        <label className="photo-btn">
          <input id="photo" type="file" accept="image/*" aria-label=${data.photo ? 'Change your photo' : 'Add a photo'} onChange=${pickPhoto} />
          ${data.photo ? html`<img className="photo-img" src=${data.photo} alt="Your profile" />` : html`<${Art} svg=${SVG.ring} tag="div" className="ring" /><span className="plus" aria-hidden="true">+</span>`}
        </label>
        <span className="photo-label">${data.photo ? 'Change photo' : 'Add a photo'}</span>
      </div>
      <div className="fields">
        <div className="field rise" style=${{ '--i': 2 }}>
          <div className="field-head"><label htmlFor="name">Name</label></div>
          <div className=${`box ${showErrors && !nameOk ? 'bad' : ''} ${nameShake}`}><input id="name" autoComplete="given-name" maxLength="30" value=${data.name} onInput=${e => set({ name: e.target.value })} /></div>
          ${showErrors && !nameOk && html`<p className="hint bad">Add your name so friends know it's you.</p>`}
        </div>
        <div className="field rise" style=${{ '--i': 3 }}>
          <div className="field-head"><label htmlFor="username">Username</label></div>
          <div className=${`box ${userBad ? 'bad' : ''} ${userShake}`}>
            <span className="at-sign">@</span>
            <input id="username" autoCapitalize="none" autoCorrect="off" spellCheck="false" maxLength="20" value=${data.username} aria-describedby="username-hint" onInput=${e => set({ username: e.target.value.toLowerCase().replace(/[^a-z0-9._]/g, '') })} />
            ${userState === 'ok' && html`<span className="ok" aria-hidden="true">✓</span>`}
            ${userState === 'wait' && html`<span className="wait" aria-hidden="true"></span>`}
          </div>
          <p id="username-hint" aria-live="polite" className=${'hint' + (userBad ? ' bad' : '')}>${showErrors && userState === 'idle' ? 'Choose a username to continue.' : hints[userState]}</p>
        </div>
        <div className="field rise" style=${{ '--i': 4 }}>
          <div className="field-head"><label htmlFor="bio">Short bio</label><span className=${'count' + (data.bio.length >= BIO_MAX ? ' full' : '')}>${data.bio.length}/${BIO_MAX}</span></div>
          <div className="box area"><textarea id="bio" maxLength=${BIO_MAX} value=${data.bio} onInput=${e => set({ bio: e.target.value })}></textarea></div>
        </div>
      </div>
    </div>
    <div className="foot rise" style=${{ '--i': 5 }}><button id="continue-about" className="cta" aria-disabled=${!valid} onClick=${go}>Continue</button></div>`;
}

/* A2 · What you're into */
function Chip({ id, label, on, onToggle, i }) {
  const [just, setJust] = useState(false);
  return html`<span className="chip-w" style=${{ '--i': i }}><button id=${id} className=${`chip ${on ? 'on' : ''} ${just ? 'just' : ''}`} aria-pressed=${on}
    onClick=${() => { setJust(true); onToggle(); }} onAnimationEnd=${() => setJust(false)}>
    ${on && html`<span className="tick" aria-hidden="true">✓</span>`}${label}</button></span>`;
}

function AddChip({ id, onAdd, i }) {
  const [editing, setEditing] = useState(false);
  const [v, setV] = useState('');
  const commit = () => { if (v.trim()) onAdd(v.trim()); setV(''); setEditing(false); };
  if (editing) return html`<input id=${id} className="chip-input" autoFocus maxLength="24" placeholder="Type and press enter" aria-label="Add your own" value=${v}
    onInput=${e => setV(e.target.value)} onBlur=${commit}
    onKeyDown=${e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setV(''); setEditing(false); } }} />`;
  return html`<span className="chip-w" style=${{ '--i': i }}><button id=${id} className="chip add" onClick=${() => setEditing(true)}>+ Add your own</button></span>`;
}

function ChipGroup({ prefix, options, field, data, set }) {
  const picked = data[field];
  const toggle = l => set({ [field]: picked.includes(l) ? picked.filter(x => x !== l) : [...picked, l] });
  const customKey = field + 'Custom';
  const all = [...options, ...data[customKey]];
  const add = l => {
    const hit = all.find(x => x.toLowerCase() === l.toLowerCase());
    if (hit) { if (!picked.includes(hit)) set({ [field]: [...picked, hit] }); return; }
    set({ [customKey]: [...data[customKey], l], [field]: [...picked, l] });
  };
  return html`<div className="chips">
    ${all.map((l, i) => html`<${Chip} key=${l} id=${`${prefix}-${i}`} label=${l} i=${i} on=${picked.includes(l)} onToggle=${() => toggle(l)} />`)}
    <${AddChip} id=${`${prefix}-add`} i=${all.length} onAdd=${add} />
  </div>`;
}

function Into({ data, set, next, back }) {
  const total = data.favourites.length + data.tries.length;
  const ready = data.favourites.length >= MIN_FAVOURITES;
  const [shake, nudge] = useNudge();
  const left = MIN_FAVOURITES - data.favourites.length;
  return html`<${Art} svg=${SVG.decorWave} tag="div" style=${{ display: 'contents' }} />
    <${Top} step=${2} onBack=${back} />
    <div className="scroll">
      <div className="q rise" style=${{ '--i': 0 }}><${Title}>What are you into?<//><p>Helps friends pick waves you'll actually say yes to.</p></div>
      <div className="sections">
        <div className=${`sec-head ${shake}`}><b>Favourite activities</b><span aria-live="polite" className=${ready ? 'done' : ''}>${ready ? 'Nice picks ✓' : (data.favourites.length ? `${left} more to go` : 'Pick 3+')}</span></div>
        <${ChipGroup} prefix="fav" options=${FAVOURITES} field="favourites" data=${data} set=${set} />
        <div className="gap8"></div>

    <div className="foot rise" style=${{ '--i': 3 }}>
      <button id="continue-into" className="cta" aria-disabled=${!ready} onClick=${() => ready ? next() : nudge()}>
        Continue${total > 0 && html`<span> · <span key=${total} className="bump">${total}</span> picked</span>`}
      </button>
    </div>`;
}

/* A3 · Socials */
function Socials({ data, set, next, back }) {
  const [busy, setBusy] = useState({});
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const toggle = k => {
    if (busy[k]) return;
    if (data.linked.includes(k)) { set({ linked: data.linked.filter(x => x !== k) }); return; }
    setBusy(b => ({ ...b, [k]: true }));
    timers.current.push(setTimeout(() => {
      setBusy(b => ({ ...b, [k]: false }));
      set(d => ({ linked: [...d.linked, k] }));
    }, 750));
  };
  return html`<${Art} svg=${SVG.decorWave} tag="div" style=${{ display: 'contents' }} />
    <${Top} step=${3} onBack=${back} onSkip=${next} />
    <div className="scroll">
      <div className="q rise" style=${{ '--i': 0 }}><${Title}>Link your socials<//><p>Optional. Friends can tap through from your profile.</p></div>
      <div className="socials rise" style=${{ '--i': 1 }}>
        ${SOCIALS.map(([k, name]) => {
          const on = data.linked.includes(k);
          return html`<div key=${k} className=${'row' + (on ? ' linked' : '')}>
            <${Art} svg=${SVG[k]} tag="div" className="logo" />
            <div className="who"><b>${name}</b><span>${on ? '@' + data.username : 'Not linked'}</span></div>
            ${on
              ? html`<button id=${'link-' + k} className="link on" aria-label=${'Unlink ' + name} onClick=${() => toggle(k)}>Linked ✓</button>`
              : html`<button id=${'link-' + k} className="link" aria-label=${'Link ' + name} aria-busy=${!!busy[k]} onClick=${() => toggle(k)}>${busy[k] ? html`<span className="wait" aria-hidden="true"></span>` : 'Link'}</button>`}
          </div>`;
        })}
      </div>
    </div>
    <div className="foot rise" style=${{ '--i': 3 }}>
      <p className="later">You can add these later in your profile</p>
      <button id="finish" className="cta" onClick=${next}>Finish</button>
    </div>`;
}

/* Keeps something mounted just long enough to play its exit */
function Presence({ show, children }) {
  const [mounted, setMounted] = useState(show);
  const [leaving, setLeaving] = useState(false);
  useEffect(() => {
    if (show) { setMounted(true); setLeaving(false); return; }
    if (!mounted) return;
    setLeaving(true);
    const t = setTimeout(() => { setMounted(false); setLeaving(false); }, 210);
    return () => clearTimeout(t);
  }, [show]);
  if (!show && !mounted) return null;
  return html`<div className=${'pres' + (leaving && !show ? ' leaving' : '')}>${children}</div>`;
}

function Seg({ id, a, b, second, onPick, tint }) {
  return html`<div className=${`wv-seg ${second ? 'two' : ''} ${tint ? 'tint' : ''}`} role="tablist">
    <i></i>
    <button id=${id + '-a'} role="tab" aria-selected=${!second} className=${second ? '' : 'on'} onClick=${() => onPick(false)}>${a}</button>
    <button id=${id + '-b'} role="tab" aria-selected=${second} className=${second ? 'on' : ''} onClick=${() => onPick(true)}>${b}</button>
  </div>`;
}

function Stars({ n, large }) {
  return html`<div className=${'wv-stars' + (large ? ' lg' : '')} role="img" aria-label=${n + ' out of 5 stars'}>${[0, 1, 2, 3, 4].map(i => html`<span key=${i} className=${i < n ? '' : 'off'} style=${{ '--i': i }}>★</span>`)}</div>`;
}

function WaveCard({ w, i, going, out, onIn, onView, onDismiss }) {
  const invite = w.kind === 'invite';
  return html`<div className=${'wv-slot' + (out ? ' out' : '')} style=${{ '--i': i }}><div>
    <article className=${'wv-card ' + w.kind}>
      <div className="wv-from"><span className="wv-a28" style=${{ background: w.bg }}>${w.a}</span><b>${going ? `You're going · ${w.who}'s wave` : w.from}</b><span>${w.when}</span></div>
      <div className="wv-title">${w.title}</div>
      <div className="wv-meta">${w.meta}</div>
      ${going
        ? html`<div className="iv-going-row"><span className="iv-going-chip">Going ✓</span>${going.cal && html`<span className="iv-cal-chip"><span className="iv-g s16">G</span>In calendar</span>`}<button id=${`going-view-${w.id}`} className="iv-view" onClick=${onView}>View</button></div>`
        : html`<div className="wv-acts">
            <button id=${`view-${w.kind}-${w.id}`} className="wv-btn ghost" onClick=${onView}>View more</button>
            <button id=${`in-${w.kind}-${w.id}`} className="wv-btn in" onClick=${onIn}>I'm in</button>
          </div>
          <button id=${`dismiss-${w.kind}-${w.id}`} className=${'wv-x' + (invite ? '' : ' plain')} aria-label=${'Dismiss ' + w.title} onClick=${onDismiss}><${Art} svg=${invite ? ICON.closeO : ICON.closeN} /></button>`}
    </article>
  </div></div>`;
}

function PastCard({ p, i, onOpen }) {
  const body = html`
    <div className="wv-strip">${WV_PHOTOS.slice(p.photos, p.photos + 3).map((src, k) => html`<img key=${k} src=${src} alt="" />`)}${p.more && html`<span className="wv-more">${p.more}</span>`}</div>
    <div className="wv-title">${p.title}</div>
    <div className="wv-meta">${p.meta}</div>
    <div className="wv-row">
      <div className="wv-went"><span className="wv-stack">${p.who.map(k => html`<span key=${k} style=${{ background: A[k][1], color: A[k][2] }}>${A[k][0]}</span>`)}<span style=${{ background: '#bee9e8', color: '#1b4965' }}>${p.plus}</span></span>${p.went}</div>
      ${p.rate ? html`<span className="wv-rate">Rate it</span>` : html`<${Stars} n=${p.stars} />`}
    </div>`;
  return html`<button id=${'past-' + p.id} className="wv-past" style=${{ '--i': i, background: p.bg, borderColor: p.line, borderRadius: p.radius }} onClick=${onOpen}>${body}</button>`;
}

      <div className="wv-people">${people.map(([a, n, bg, fg], i) => html`<div key=${n} className="wv-person" style=${{ '--i': i }}><span className="wv-a44" style=${n === 'You' && data.photo ? { backgroundImage: `url(${data.photo})` } : { background: bg, color: fg }}>${n === 'You' && data.photo ? '' : a}</span>${n}</div>`)}</div>
      <div className="wv-sec-row"><div className="wv-sec">Photos<em>24</em></div><button id="see-all" className="wv-seeall">See all</button></div>
      <div className="wv-grid">${WV_GRID.map((src, i) => html`<img key=${i} src=${src} alt="" style=${{ '--i': i }} />`)}</div>
      <button id="add-photos" className="wv-add">+ Add more photos</button>
    </div>
  </div>`;
}

function Chat({ sent, onSend, onRecap, onBack }) {
  const [draft, setDraft] = useState('');
  const box = useRef(null);
  useEffect(() => { if (sent.length && box.current) box.current.scrollTop = box.current.scrollHeight; }, [sent.length]);
  const send = () => { const t = draft.trim(); if (!t) return; onSend(t); setDraft(''); };
  return html`<div className="wv-chat wv-swap">
    <div className="wv-chat-head">
      <div className="wv-chat-id"><button id="chat-back" aria-label="Back to past waves" onClick=${onBack}><${Art} svg=${SVG.back} /></button><div><${Title}>Sunset at Wreck Beach<//><span>Sat, Nov 2 · 7 people</span></div></div>
      <${Seg} id="chat-tabs" tint=${true} a="Recap" b="Chat" second=${true} onPick=${v => !v && onRecap()} />
    </div>
    <div className="wv-thread" ref=${box}>
      ${THREAD.map((m, i) => m.day ? html`<div key=${i} className="wv-day">${m.day}</div>`
        : m.mark ? html`<div key=${i} className="wv-mark">${m.mark}</div>`
        : m.me ? html`<div key=${i} className="wv-msg me" style=${{ '--i': i }}><div><span className="wv-bub">${m.t}</span></div></div>`
        : html`<div key=${i} className="wv-msg" style=${{ '--i': i }}><span className="wv-a28" style=${{ background: m.bg }}>${m.a}</span><div><small>${m.n}</small><span className="wv-bub">${m.t}</span></div></div>`)}
      ${sent.map((t, i) => html`<div key=${'s' + i} className="wv-msg me" style=${{ '--i': 0 }}><div><span className="wv-bub">${t}</span></div></div>`)}
    </div>
    <div className="wv-composer">
      <button id="chat-plus" className="wv-plus" aria-label="Add attachment"><${Art} svg=${ICON.plus} /></button>
      <div className="wv-field"><input id="chat-input" placeholder="Message the group…" aria-label="Message the group" autoComplete="off" value=${draft} onInput=${e => setDraft(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') send(); }} /><button id="chat-send" className="wv-send" aria-label="Send" onClick=${send}><${Art} svg=${ICON.up} /></button></div>
    </div>
  </div>`;
}

function Waves({ data, past, setPast, inviteCount, going, onIn, onView, gone, setGone, myWaves, onCreate, onOpenMine }) {
  const [dir, setDir] = useState('wv-fwd');
  const [detail, setDetail] = useState(null); // null | recap | chat
  const [chatNew, setChatNew] = useState(true);
  const [sent, setSent] = useState([]);
  const pick = v => { if (v === past) return; setDir(v ? 'wv-fwd' : 'wv-rev'); setPast(v); };
  const dismiss = id => setGone(g => ({ ...g, [id]: true }));
  const openChat = () => { setChatNew(false); setDetail('chat'); };
  const closeDetail = () => setDetail(null);
  const card = (w, i) => { const key = w.kind + w.id; return html`<${WaveCard} key=${key} w=${w} i=${i} going=${going[key]} out=${!!gone[key]} onIn=${() => onIn(w)} onView=${() => onView(w)} onDismiss=${() => dismiss(key)} />`; };
  const otherGone = OTHER.every(w => gone[w.kind + w.id]);
  const anyInvite = INVITES.some(w => !gone[w.kind + w.id]);
  return html`<div className="wv">
    <div className="wv-scroll">
      <${Art} svg=${WV_DECOR} style=${{ display: 'contents' }} />
      <header className="wv-head"><small>hangtime</small><${Title}>Waves<//><p>What your friends are up to</p></header>
      <div className="wv-top-seg"><${Seg} id="waves-tabs" a="Upcoming" b="Past" second=${past} onPick=${pick} /></div>
      ${past
        ? html`<div key="past" className=${'wv-body ' + dir}><div className="wv-past-list">${PAST.map((p, i) => html`<${PastCard} key=${p.id} p=${p} i=${i} onOpen=${() => { if (p.id === 'sunset') setDetail('recap'); }} />`)}</div></div>`
        : html`<div key="up" className=${'wv-body ' + dir}>
            ${myWaves.length > 0 && html`<div className="wv-h2">Your waves</div><div className="cw-mine">${myWaves.map(w => html`<${WaveFeedCard} key=${w.id} id=${'mine-' + w.id} tag="button" d=${w.draft} data=${data} onClick=${() => onOpenMine(w)} />`)}</div>`}
            ${anyInvite && html`<div className="wv-h2">Invites${inviteCount > 0 && html`<span key=${inviteCount} className="wv-pill bump">${inviteCount}</span>`}</div>`}
            ${INVITES.map((w, i) => card(w, i))}
            ${!otherGone && html`<div className=${'wv-h2' + (anyInvite ? ' close' : '')}>Other waves</div>`}
            ${OTHER.map((w, i) => card(w, i + 2))}
          </div>`}
    </div>
    ${!past && !detail && html`<button id="create-wave" className="cw-fab" onClick=${onCreate}><b>+</b>Create wave</button>`}
    ${detail && html`<div className="wv-detail">
      ${detail === 'recap'
        ? html`<${Recap} key="r" data=${data} chatNew=${chatNew} onChat=${openChat} onBack=${closeDetail} />`
        : html`<${Chat} key="c" sent=${sent} onSend=${t => setSent(s => [...s, t])} onRecap=${() => setDetail('recap')} onBack=${closeDetail} />`}
    </div>`}
  </div>`;
}

/* Wave invite */
const ringFor = going => going
  ? '<svg class="iv-ring" width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="26.5" fill="#fff" stroke="#62B6CB" stroke-width="3"/></svg>'
  : '<svg class="iv-ring" width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="26.75" fill="#fff" stroke="#EE6C4D" stroke-width="2.5" stroke-dasharray="5 4"/></svg>';
const RING_ON = ringFor(true), RING_OFF = ringFor(false);
INNER[RING_ON] = { __html: RING_ON }; INNER[RING_OFF] = { __html: RING_OFF };

function InvitePin({ going, label, onClick, id }) {
  return html`<button id=${id} className=${'iv-pin ' + (going ? 'going' : 'waiting')} aria-label=${going ? 'Your wave with Maya, going' : 'Invite from Maya, waiting on you'} onClick=${onClick}>
    <span className="iv-head"><${Art} key=${going ? 'g' : 'w'} svg=${going ? RING_ON : RING_OFF} style=${{ display: 'contents' }} /><span className="iv-av">MC</span>${going ? html`<span className="iv-mark iv-ok">✓</span>` : html`<span className="iv-mark iv-qm">?</span>`}</span>
    <span className=${'iv-label ' + (going ? 'going' : 'waiting')}>${label}</span>
  </button>`;
}

      <div className="iv-sheet">
        <div className="iv-from"><span className="iv-a26">M</span><b>${isGoing ? "Maya's wave" : 'Maya invited you'}</b>${isGoing ? html`<span className="iv-tag yes">You're going ✓</span>` : html`<span className="iv-tag">Waiting on you</span>`}</div>

          <div className="iv-fact"><span className="iv-sq"></span><div className="iv-fact-t"><b>Pho Hoang, Wesbrook Village</b><span>12 min walk ·<a id="pho-directions" href=${PHO_DIRECTIONS} target="_blank" rel="noopener">Directions</a></span></div></div>
        </div>
        <p className="iv-note">“Anyone down? Gonna be quick, meet out front.”</p>
        <div className="iv-going-h">Going<em key=${isGoing ? 3 : 2} className="bump">${isGoing ? 3 : 2}</em></div>
        <div className="iv-people">
          ${isGoing && html`<div key="you" className="iv-p" style=${{ '--i': 0 }}><span className="iv-a46 iv-you" style=${data.photo ? { backgroundImage: `url(${data.photo})` } : { background: '#5fa8d3', color: '#fff' }}>${data.photo ? '' : initials}</span>You</div>`}
          ${firm.map(([a, n, bg, fg], i) => html`<div key=${n} className="iv-p" style=${{ '--i': i + 1 }}><span className="iv-a46" style=${{ background: bg, color: fg }}>${a}</span>${n}</div>`)}

          <div className="iv-p un" style=${{ '--i': 4 }}><span className="iv-a46">EK</span>Ethan</div>

        ? html`<div className="iv-bar-t" key="y"><b>You're going</b>${going.cal && html`<span><span className="iv-g s16">G</span>In your Google Calendar</span>`}</div><button id="going-btn" className="btn b h52 iv-going-btn" style=${{ width: 'auto' }}>Going ✓</button>`
        : html`<button id="cant" className="btn b iv-cant" style=${{ height: 52 }} onClick=${onCant}>Can't</button><button id="invite-in" className="btn o grow" style=${{ height: 52 }} onClick=${onIn}>I'm in</button>`}
    </div>
  </div>`;
}

}

/* Photo feed */
const FEED_STAR = fill => `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 .4L8.94 4.74L13.66 5.24L10.14 8.42L11.12 13.06L7 10.7L2.88 13.06L3.86 8.42L.34 5.24L5.06 4.74Z" fill="${fill}"/></svg>`;
const STAR_ON = FEED_STAR('#EE6C4D'), STAR_OFF = FEED_STAR('#E2E8F0');
INNER[STAR_ON] = { __html: STAR_ON }; INNER[STAR_OFF] = { __html: STAR_OFF };
const FEED_SEED = [
  { id: 'pizza', title: 'Pizza night at Nook', sub: 'Fri · Kitsilano · 2h 10m', rating: 5, photos: [PP_SELFIE, PP_PIZZA], extra: 4, who: [['LW', '#5fa8d3'], ['AV', '#ee6c4d'], ['NP', '#1b4965']], plus: 3, join: true },
  { id: 'sushi', title: 'Sushi before midterms', sub: 'Thu · The Nest · 1h 20m', rating: 4, photos: [PP_PIZZA, PP_SELFIE], extra: 2, who: [['SO', '#62b6cb'], ['LW', '#5fa8d3']], plus: 2, join: true },
];

function FeedCard({ p, i, data, fresh }) {
  const many = p.extra > 0;
  const two = p.photos.length > 1;
  return html`<article className=${'pf-card' + (fresh ? ' pf-new' : '')} style=${{ '--i': i }}>
    ${fresh && [[-130, -30, 'sc1'], [120, -34, 'sc2'], [-90, 30, 'sc3'], [140, 22, 'sc4']].map(([x, y, k]) => html`<${Art} key=${k} svg=${SVG[k]} className="pf-burst" style=${{ '--bx': x + 'px', '--by': y + 'px' }} />`)}
    <div className="pf-top">
      <div className="pf-id"><b>${p.title}</b><span>${p.sub}</span></div>
      ${p.rating && html`<div className="pf-rate"><div className="pf-stars" role="img" aria-label=${p.rating + ' out of 5 stars'}>${[0, 1, 2, 3, 4].map(k => html`<${Art} key=${k} svg=${k < p.rating ? STAR_ON : STAR_OFF} style=${{ '--i': k, display: 'contents' }} />`)}</div>${p.rating.toFixed(1)} wave</div>`}
    </div>
    <div className="pf-collage">
      <img className="pf-big" src=${p.photos[0]} alt="" />
      ${two && html`<div className="pf-side">
        <img className=${many ? '' : 'pf-tall'} src=${p.photos[1]} alt="" />
        ${many && html`<div className="pf-more"><b>+${p.extra}</b>${p.extra === 1 ? 'photo' : 'photos'}</div>`}
      </div>`}
    </div>
    ${p.caption && html`<p className="pf-cap">${p.caption}</p>`}
    ${p.genre && html`<span className="pf-song">♪ ${p.genre}</span>`}
    <div className="pf-foot">
      <div className="pf-stack">
        ${data.photo && !p.join ? html`<img src=${data.photo} alt="" />` : html`<${Art} svg=${SVG.avatar} tag="span" />`}
        ${p.who.map(([a, bg]) => html`<span key=${a} className="pf-a" style=${{ background: bg }}>${a}</span>`)}
      </div>
      <div className="pf-rode">+${p.plus} rode this wave</div>
      ${p.join && html`<button id=${'join-next-' + p.id} className="pf-join">Join next</button>`}
    </div>
  </article>`;
}

function PhotoFeed({ data, posts, freshId }) {
  const box = useRef(null);
  useEffect(() => { if (box.current) box.current.scrollTop = 0; }, [posts.length]);
  const all = [...posts, ...FEED_SEED];
  return html`<div className="pf"><div className="pf-scroll" ref=${box}>
    <header className="pf-head"><small>hangtime</small><${Title}>SurfSUP<//></header>
    ${all.map((p, i) => html`<${FeedCard} key=${p.id} p=${p} i=${i} data=${data} fresh=${p.id === freshId} />`)}
  </div></div>`;
}

function Wheel({ id, items, value, onChange, fmt = v => v }) {
  const box = useRef(null);
  const quiet = useRef(true);
  useLayoutEffect(() => {
    box.current.scrollTop = items.indexOf(value) * 40;
    const t = setTimeout(() => { quiet.current = false; }, 120);
    return () => clearTimeout(t);
  }, []);
  const onScroll = () => {
    if (quiet.current) return;
    const v = items[Math.max(0, Math.min(items.length - 1, Math.round(box.current.scrollTop / 40)))];
    if (v !== value) onChange(v);
  };
  return html`<div id=${id} className="cw-wheel" ref=${box} onScroll=${onScroll}>
    ${items.map((v, i) => html`<button key=${v} id=${`${id}-${v}`} className=${v === value ? 'cw-on' : ''} onClick=${() => { box.current.scrollTo({ top: i * 40, behavior: 'smooth' }); onChange(v); }}>${fmt(v)}</button>`)}
  </div>`;
}

function CreateWave({ data, initial, onDone }) {
  const [d, setD] = useState(initial ? initial.draft : CW_BLANK);

  const [dir, setDir] = useState('');

  const [friendQ, setFriendQ] = useState('');
  const [shake, nudge] = useNudge();
  const id = useRef(initial ? initial.id : 'wave-' + Date.now());
  const set = p => setD(x => ({ ...x, ...p }));

  const idx = CW_STEPS.indexOf(step);
  const finish = () => onDone({ id: id.current, draft: d });
  const next = () => { if (editing) { setEditing(false); go('review'); } else go(CW_STEPS[idx + 1]); };
  const back = () => {
    if (editing) { setEditing(false); go('review', true); return; }
    if (idx === 0) { onDone(null); return; }
    go(CW_STEPS[idx - 1], true);
  };
  const edit = to => { setEditing(true); go(to, true); };

Object.values(WE).forEach(s => { INNER[s] = { __html: s }; });
const WE_CONTACTS = [['LW', '#5fa8d3', '#fff'], ['AV', '#ee6c4d', '#fff'], ['NP', '#1b4965', '#fff'], ['SO', '#bee9e8', '#1b4965'], ['JR', '#cae9ff', '#1b4965']];
const WE_AFTER_PHOTOS_MS = 10000;
const WE_GROUP = POST_GROUPS[0];
const WE_PHOTOS = WE_GROUP.photos.slice(0, 5);

function WaveEndedPopup({ onSkip, onShare, onStart }) {
  const [rating, setRating] = useState(0);
  const [picked, setPicked] = useState([]);
  const [out, setOut] = useState(false);
  const heading = useRef(null);
  const timer = useRef(null);
  useEffect(() => { heading.current?.focus({ preventScroll: true }); return () => clearTimeout(timer.current); }, []);
  const leave = fn => { if (out) return; setOut(true); timer.current = setTimeout(fn, 240); };
  const field = (id, icon, label, fn, cls) => html`<button id=${id} className=${'we-field ' + (cls || '')} onClick=${fn}><${Art} svg=${icon} style=${{ display: 'contents' }} /><span>${label}</span><em aria-hidden="true">›</em></button>`;
  const start = () => leave(onStart);
  return html`<div className=${'we-dim' + (out ? ' we-out' : '')} id="we-dim" onClick=${() => leave(onSkip)}></div>
    <div className=${'we-pop' + (out ? ' we-out' : '')} role="dialog" aria-modal="true" aria-labelledby="we-title">
      <span className="we-grab"></span>
      <div className="we-top"><b>hangtime</b><button id="we-skip" className="we-skip" onClick=${() => leave(onSkip)}>Skip</button></div>
      <section className="we-rate">
        <h2 id="we-title" ref=${heading} tabIndex="-1">You just left your wave</h2>
        <p>Pizza night at Nook · 2h 10m</p>
        <div className="we-stars" role="radiogroup" aria-label="Rate your wave">${[1, 2, 3, 4, 5].map(n => html`<button key=${n} id=${'we-star-' + n} className=${'we-star' + (n <= rating ? ' we-on' : '')} style=${{ '--i': n - 1 }} role="radio" aria-checked=${n === rating} aria-label=${n + ' stars'} onClick=${() => setRating(n)}><${Art} svg=${WE.star} style=${{ display: 'contents' }} /></button>`)}</div>
        ${field('we-share', WE.camera, 'Share photos with your waddle', () => leave(onShare), 'we-blue')}
      </section>
      <div className="we-mascot"><${Art} svg=${CW.mascot} tag="div" /></div>
      <section className="we-next">
        <h3>You're it!</h3>
        <p>Be the first to start the next wave and invite your friends.</p>
        ${field('we-date', WE.date, 'Select a date', start)}
        ${field('we-loc', WE.loc, 'Select a location', start)}
        ${field('we-act', WE.act, 'Select an activity', start)}
        <div className="we-inv">Invite your new contacts<span>${picked.length} selected</span></div>
        <div className="we-contacts">${WE_CONTACTS.map(([a, bg, fg]) => { const on = picked.includes(a); return html`<button key=${a} id=${'we-c-' + a} className=${'we-c' + (on ? ' we-on' : '')} style=${{ background: bg, color: fg }} aria-pressed=${on} onClick=${() => setPicked(p => on ? p.filter(x => x !== a) : [...p, a])}>${a}</button>`; })}</div>
        <button id="we-start" className="we-start" onClick=${start}>Start the next wave</button>
      </section>
    </div>`;
}

function ShareWavePhotos({ onClose, onSent }) {
  const [sel, setSel] = useState([]);
  const [sending, setSending] = useState(false);
  const [shake, nudge] = useNudge();
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);
  const all = sel.length === WE_PHOTOS.length;
  const send = () => {
    if (sending) return;
    if (!sel.length) { nudge(); return; }
    setSending(true);
    timer.current = setTimeout(onSent, 950);
  };
  return html`<div className="we-page">
    <${Art} svg=${WE.decor} style=${{ display: 'contents' }} />
    <header className="we-head"><small>hangtime</small><${Title}>Share your photos<//><p>Pick from your camera roll · Pizza night at Nook</p></header>
    <button id="share-skip" className="we-skip" onClick=${onClose}>Skip</button>
    <section className="we-pick">
      <div className="we-row"><span className="we-tag">Wave on Sept. 29th</span><button id="share-all" className="we-all" onClick=${() => setSel(all ? [] : WE_PHOTOS.map((_, i) => i))}>${all ? 'Clear all' : 'Select all'}</button></div>
      <span className="we-taken">Taken during your wave</span>
      <div className="pp-grid">
        ${WE_PHOTOS.map((src, i) => { const at = sel.indexOf(i); return html`<button key=${i} id=${'share-' + i} className=${'pp-tile' + (at >= 0 ? ' pp-sel' : '')} style=${{ '--i': i }} aria-pressed=${at >= 0} aria-label=${`Photo ${i + 1}`} onClick=${() => setSel(s => s.includes(i) ? s.filter(x => x !== i) : [...s, i])}><img src=${src} alt="" /><span className="pp-dot">${at >= 0 ? at + 1 : ''}</span></button>`; })}
        <button id="share-more" className="we-more"><i><${Art} svg=${PP.plus} style=${{ display: 'contents' }} /></i><span>More from<br />camera roll</span></button>
      </div>
    </section>
    <section className="we-ready">
      <${Art} svg=${CW.mascot} tag="div" className=${'we-ready-m' + (sending ? ' we-hop' : '')} />
      <div className="we-ready-t"><b>Ready to send?</b><span>${sel.length} ${sel.length === 1 ? 'photo' : 'photos'} selected</span></div>
      <button id="share-send" className=${`we-send ${sending ? 'we-going' : ''} ${shake}`} aria-disabled=${!sel.length} onClick=${send}><${Art} svg=${WE.plane} style=${{ display: 'contents' }} />${sending ? 'Sending…' : 'Send it to your wave'}</button>
    </section>
  </div>`;
}

/* Tabs: Map and Waves */
function Home({ data }) {
  const [tab, setTab] = useState('map');
  const [seenWaves, setSeenWaves] = useState(false);
  const [seenPost, setSeenPost] = useState(false);
  const [seenPhotos, setSeenPhotos] = useState(false);
  const [posts, setPosts] = useState([]);
  const [freshId, setFreshId] = useState(null);
  const [create, setCreate] = useState(null); // { initial }
  const [myWaves, setMyWaves] = useState([]);
  const [guest, setGuest] = useState(false);
  const [popup, setPopup] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  const [sentToast, setSentToast] = useState(false);
  const sentTimer = useRef(null);
  const busy = useRef(false);
  const photosAt = useRef(null);
  const [past, setPast] = useState(false);
  const [going, setGoing] = useState({});
  const [gone, setGone] = useState({});
  const [detailOpen, setDetailOpen] = useState(false);
  const [preview, setPreview] = useState(false);
  const [confirm, setConfirm] = useState(null); // { w, ctx }
  const [checked, setChecked] = useState(false);
  const [always, setAlways] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  useEffect(() => () => clearTimeout(toastTimer.current), []);
  const PHO = INVITES[0], phoKey = PHO.kind + PHO.id;
  const sunsetKey = OTHER[0].kind + OTHER[0].id;
  const inviteCount = INVITES.filter(w => !gone[w.kind + w.id] && !going[w.kind + w.id]).length;
  const go = t => { setToast(null); if (t === 'waves') setSeenWaves(true); if (t === 'post') setSeenPost(true); if (t === 'photos') { setSeenPhotos(true); if (!photosAt.current) photosAt.current = Date.now(); } setFreshId(null); setShareOpen(false); setTab(t); };
  const showToast = ctx => { setToast({ ctx, key: Date.now() }); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 3400); };
  const settle = (w, ctx, cal) => {
    setGoing(g => ({ ...g, [w.kind + w.id]: { cal } }));
    setConfirm(null);
    if (ctx === 'map') setPreview(false);
    if (cal) showToast(ctx);
  };
  const askIn = (w, ctx) => { if (always) settle(w, ctx, true); else setConfirm({ w, ctx }); };
  const finish = cal => { if (checked) setAlways(true); settle(confirm.w, confirm.ctx, cal); };
  const openDetail = () => { setPreview(false); setDetailOpen(true); };
  busy.current = !!(create || guest || detailOpen || preview || confirm || shareOpen);
  /* The reminder arrives by itself once, 10 seconds after the first tap into Photos, waiting if another overlay is open */
  useEffect(() => {
    const check = setInterval(() => {
      if (!photosAt.current || Date.now() - photosAt.current < WE_AFTER_PHOTOS_MS || busy.current) return;
      clearInterval(check);
      setPopup(true);
    }, 200);
    return () => { clearInterval(check); clearTimeout(sentTimer.current); };
  }, []);
  const phoGoing = going[phoKey];
  const phoGone = !!gone[phoKey];
  return html`
    <div className="home-view" hidden=${tab !== 'map'}><${MapView} data=${data} preview=${preview} invite=${phoGone ? null : { going: !!phoGoing }} onInvite=${() => phoGoing ? openDetail() : setPreview(true)} /></div>
    ${seenWaves && html`<div className="home-view" hidden=${tab !== 'waves'}><${Waves} data=${data} past=${past} setPast=${setPast} inviteCount=${inviteCount} going=${going} onIn=${w => askIn(w, 'feed')} onView=${w => { if (w.detail) openDetail(); else if (w.kind === 'other') setGuest(true); }} gone=${gone} setGone=${setGone} myWaves=${myWaves} onCreate=${() => setCreate({})} onOpenMine=${w => setCreate({ initial: w })} /></div>`}
    ${seenPost && html`<div className="home-view" hidden=${tab !== 'post'}><${Posting} data=${data} onPosted=${p => { setPosts(ps => [p, ...ps]); setSeenPhotos(true); setFreshId(p.id); setTab('photos'); }} /></div>`}
    ${seenPhotos && html`<div className="home-view" hidden=${tab !== 'photos'}><${PhotoFeed} data=${data} posts=${posts} freshId=${freshId} /></div>`}
    ${shareOpen && html`<${ShareWavePhotos} onClose=${() => setShareOpen(false)} onSent=${() => { setShareOpen(false); setSentToast(true); clearTimeout(sentTimer.current); sentTimer.current = setTimeout(() => setSentToast(false), 3200); }} />`}
    <${TabBar} active=${tab} badge=${tab === 'waves' && !past ? inviteCount : 0} onTab=${go} />
    ${preview && !phoGoing && html`<${InvitePreview} onClose=${() => setPreview(false)} onDetails=${openDetail} onIn=${() => askIn(PHO, 'map')} />`}
    ${detailOpen && html`<${InviteDetail} data=${data} going=${phoGoing} onBack=${() => { setToast(null); setDetailOpen(false); }} onIn=${() => askIn(PHO, 'detail')} onCant=${() => { setGone(g => ({ ...g, [phoKey]: true })); setDetailOpen(false); }} />`}
    ${create && html`<${CreateWave} key=${create.initial ? create.initial.id : 'new'} data=${data} initial=${create.initial} onDone=${w => { if (w) setMyWaves(l => l.some(x => x.id === w.id) ? l.map(x => x.id === w.id ? w : x) : [w, ...l]); setCreate(null); }} />`}
    ${guest && html`<${GuestWave} data=${data} going=${!!going[sunsetKey]} onBack=${() => setGuest(false)} onToggle=${() => setGoing(g => { const n = { ...g }; if (n[sunsetKey]) delete n[sunsetKey]; else n[sunsetKey] = { cal: false }; return n; })} />`}
    ${confirm && html`<${ConfirmSheet} wave=${confirm.w} checked=${checked} onCheck=${() => setChecked(v => !v)} onAdd=${() => finish(true)} onLater=${() => finish(false)} />`}
    ${popup && html`<${WaveEndedPopup} onSkip=${() => setPopup(false)} onShare=${() => { setPopup(false); setSeenPhotos(true); setTab('photos'); setShareOpen(true); }} onStart=${() => { setPopup(false); setCreate({}); }} />`}
    ${sentToast && html`<div className="we-toast" role="status">✓ Sent to ${WE_GROUP.wave.friends}</div>`}
    ${toast && html`<div key=${toast.key} className=${'iv-toast ' + toast.ctx} role="status"><span className="iv-g s22">G</span><b>Added to Google Calendar</b><button id="toast-view">View</button></div>`}`;
}

/* Flow */
const EMPTY = { photo: null, name: '', username: '', bio: '', favourites: [], favouritesCustom: [], tries: [], triesCustom: [], linked: [] };

function App() {
  const [data, setData] = useState(EMPTY);
  const [nav, setNav] = useState({ i: 0, dir: 'fwd', prev: null, first: true });
  const set = patch => setData(d => ({ ...d, ...(typeof patch === 'function' ? patch(d) : patch) }));
  const go = delta => setNav(n => ({ i: n.i + delta, dir: delta > 0 ? 'fwd' : 'back', prev: n.i, first: false }));
  useEffect(() => {
    if (nav.prev === null) return;
    const t = setTimeout(() => setNav(n => ({ ...n, prev: null })), 280);
    return () => clearTimeout(t);
  }, [nav.i]);

  const props = { data, set, next: () => go(1), back: () => go(-1) };
  const view = i => {
    switch (STEPS[i]) {
      case 'start': return html`<${Start} ...${props} />`;
      case 'about': return html`<${About} ...${props} />`;
      case 'into': return html`<${Into} ...${props} />`;
      case 'socials': return html`<${Socials} ...${props} />`;
      case 'done': return html`<${Done} ...${props} />`;
      default: return html`<${Home} ...${props} />`;
    }
  };
  return html`<main className="app">
    ${nav.prev !== null && html`<div key=${'out' + nav.prev} className=${'screen out-' + nav.dir} aria-hidden="true" inert="">${view(nav.prev)}</div>`}
    <div key=${STEPS[nav.i]} className=${'screen ' + (nav.first ? '' : 'in-' + nav.dir)}>${view(nav.i)}</div>
  </main>`;
}

const fitPhone = () => document.documentElement.style.setProperty('--fit', Math.min(1.25, (window.innerHeight - 40) / 894).toFixed(4));
fitPhone();
window.addEventListener('resize', fitPhone);
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
